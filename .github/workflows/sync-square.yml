name: Sync Square Appointments Catalog

on:
  schedule:
    # Runs daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    # Allows 1-click manual trigger from GitHub Actions dashboard
  push:
    paths:
      - ".github/workflows/sync-square.yml"
      - "scripts/sync_square.py"

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Square Catalog Sync
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
        run: |
          python3 scripts/sync_square.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/treatments.json
          if git diff --staged --quiet; then
            echo "No catalog changes detected from Square."
          else
            git commit -m "Auto-sync treatment menu from Square Appointments"
            git pull --rebase origin main
            git push origin main
          fi
